<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PORTAL DE COLABORADORES</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light d-flex flex-column min-vh-100">
	
	<nav class="navbar" style="background-color: #1a365d;">
	  <div class="container-fluid">
	    <a class="navbar-brand text-white fs-3" href="#">
	      <img th:src="@{/static/images/LogoGasExpressNieto.png}" height="80"
	      class="d-inline-block align-middle me-4 ">
	      <strong>Portal de Colaboradores</strong>
	    </a>
	  </div>
	</nav>
	
	<div class="d-flex justify-content-center mt-5">
        <div class="card shadow p-4" style="width: 800px; height:auto">
            <h2 class="text-center mb-4" style="color: #c81430;">Iniciar Sesión</h2>
            
            <div th:if="${error != null}" 
	             class="alert alert-danger alert-dismissible fade show" 
	             role="alert">
	            <span th:text="${error}">Mensaje de error predeterminado</span>
	            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
	        </div>
            
            <form action="login" method="POST">
	            <div class="mb-5">
				  <label for="ssoId" class="form-label h3">Usuario</label>
				  <input class="form-control form-control-lg"
				  			id="ssoId" type="text" name="ssoId" placeholder="USUARIO" required />
				</div>
				
				<div class="mb-5">
				  <label for="password" class="form-label h3">Contraseña</label>
				  <input class="form-control form-control-lg" id="password" name="password" type="password"
				  			placeholder="CONTRASEÑA" required />
				</div>
				
				<div class="d-grid mt-4">
	                <button type="submit" 
	                        class="btn btn-lg text-white" 
	                        style="background-color: #c81430;">
	                    INGRESAR
	                </button>
	            </div>
        	</form>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
